<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600;700&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#0b0c10;color:#eceef2;font-family:Inter,sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(600px 420px at 88% 18%,rgba(255,77,94,.28),transparent 70%),
 radial-gradient(520px 380px at 70% 100%,rgba(255,181,71,.18),transparent 70%),
 radial-gradient(#1c1f29 1px,transparent 1px) 0 0/26px 26px}
.wrap{position:relative;display:flex;align-items:center;height:100%;padding:0 80px;gap:56px}
.left{flex:1}
.logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(120deg,#ff4d5e,#ff7a45 55%,#ffb547);font:700 26px/1 "Space Grotesk";color:#fff;margin-bottom:34px}
h1{font:700 76px/1 "Space Grotesk";letter-spacing:-.035em}
h1 span{background:linear-gradient(120deg,#ff4d5e,#ff7a45 55%,#ffb547);-webkit-background-clip:text;color:transparent}
.role{margin-top:20px;font:600 30px/1.2 "Space Grotesk";color:#d5d8df;letter-spacing:-.01em}
.tag{margin-top:16px;font:500 22px/1.4 Inter;color:#a0a6b2}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.pills b{font:500 17px/1 "JetBrains Mono";padding:10px 14px;border-radius:10px;border:1px solid #2b2f3b;background:#14161d;color:#d5d8df}
.url{margin-top:30px;font:500 18px/1 "JetBrains Mono";color:#ff8a7a}
.photo{flex:none;width:330px;height:330px;border-radius:50%;padding:6px;background:linear-gradient(120deg,#ff4d5e,#ff7a45 55%,#ffb547);box-shadow:0 30px 80px -20px rgba(255,77,94,.45)}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid #0b0c10;display:block}
</style></head><body><div class="bg"></div>
<div class="wrap"><div class="left">
<div class="logo">AK</div>
<h1>Ahmad <span>Kholaif</span></h1>
<p class="role">Senior Full-Stack Engineer</p>
<p class="tag">Payments, integrations and cloud platforms<br>across fintech, food-tech and the public sector</p>
<div class="pills"><b>Node.js</b><b>TypeScript</b><b>Go</b><b>React</b><b>AWS · GCP</b></div>
<p class="url">ahmedkholaif.github.io</p>
</div>
<div class="photo"><img src="ahmad.jpg"></div>
</div></body></html>
